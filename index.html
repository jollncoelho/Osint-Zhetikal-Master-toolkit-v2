<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applique le thème avant le premier rendu (évite tout flash de couleur) -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('zhetikal.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <title>Zhetikal OSINT Master-Toolkit v2 — 1 227 outils OSINT classés</title>
    <meta
      name="description"
      content="Annuaire interactif de 1 227 outils OSINT classés en 24 catégories : téléphones, e-mails, usernames, DNS, fuites de données, métadonnées, géolocalisation, réseaux sociaux, IA. Filtres par type, recherche instantanée, favoris exportables."
    />
    <meta
      name="keywords"
      content="OSINT, cybersécurité, outils osint, annuaire osint, threat intelligence, fuites de données, métadonnées, recherche inversée, renseignement open source, zhetikal"
    />
    <meta name="author" content="Zhetikal" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020817" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
